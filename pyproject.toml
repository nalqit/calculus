[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "calcus"
version = "0.1.1"
description = "A from-scratch Python library for symbolic and numerical calculus operations"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Calcus Library Contributors"},
]
keywords = ["calculus", "symbolic", "differentiation", "integration", "mathematics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.scripts]
calcus = "calcus.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[tool.setuptools.packages.find]
where = ["."]
include = ["calcus*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=calcus --cov-report=term-missing --cov-report=html"

[tool.coverage.run]
source = ["calcus"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "def __repr__",
    "@abstractmethod",
]
fail_under = 80

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
